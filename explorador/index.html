<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10233c">
<title>Exploradores — Mundo de juegos</title>
<style>
:root{--ink:#14243a;--sky:#dff5ff;--blue:#27a9e8;--yellow:#ffd83d;--pink:#ff6d9e;--green:#55d69a;--purple:#a58bff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#a9e9ff,#f9f0b7 55%,#ffc7dc);color:var(--ink);touch-action:manipulation}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:auto;padding:7px;gap:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}
.brand{display:flex;align-items:center;gap:7px;font-weight:1000;font-size:clamp(18px,2.4vw,25px);letter-spacing:-.7px}.mascot{width:48px;height:48px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 #8ab9cc}
#sayStatus{font-size:clamp(11px,1.5vw,15px);font-weight:800;background:#ffffffb8;padding:6px 10px;border-radius:99px}
nav{display:flex;gap:6px;justify-content:center}
nav button,.back{border:0;border-radius:16px;padding:8px 12px;font-size:clamp(12px,1.5vw,16px);font-weight:950;color:#17304a;background:#fff;box-shadow:0 4px 0 #a5c5d3}
nav button[aria-selected=true]{background:#173b62;color:#fff;box-shadow:0 4px 0 #0a2038}
main{flex:1;min-height:0;position:relative}
.panel{display:none;height:100%;min-height:0;background:#ffffffb8;border:3px solid #fff;border-radius:26px;padding:9px;box-shadow:0 8px 24px #41617a22;overflow:auto}
.panel.active{display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:clamp(22px,3vw,34px);line-height:1.05} .hint{margin:0;font-weight:750;color:#36516a;font-size:clamp(12px,1.5vw,16px)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;flex:1;min-height:0}
.tile{border:0;border-radius:16px;min-height:76px;padding:7px;background:var(--tile,#fff);box-shadow:0 6px 0 var(--shade,#b7cbd4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#172b40;font-size:clamp(12px,1.6vw,17px);font-weight:950}
.tile:active,nav button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shade,#b7cbd4)}
.tile .emoji{font-size:clamp(28px,4vw,42px);line-height:1.05}
.dino-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.dino{background:#fff;border:3px solid #fff;box-shadow:0 5px 0 #b4d4dc;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:5px;font-weight:950;font-size:clamp(11px,1.35vw,15px);min-height:0}
.dino svg{width:min(100%,112px);height:clamp(48px,8vh,78px)}
.dino:active{transform:scale(.98)}
.flipper-wrap{display:grid;grid-template-columns:1fr minmax(0,2.3fr) 1fr;gap:10px;flex:1;min-height:0;align-items:stretch}
.flipper-key{border:0;border-radius:24px;background:linear-gradient(160deg,#ffdf57,#ff9f42);box-shadow:0 7px 0 #d27b32;font-size:clamp(18px,2.6vw,28px);font-weight:1000;color:#63360b;touch-action:none}
.flipper-key.right{background:linear-gradient(160deg,#8ee8ff,#4cafff);box-shadow:0 7px 0 #277bc2;color:#07385d}
#table{width:100%;height:100%;min-height:180px;border-radius:22px;background:radial-gradient(ellipse at 50% 15%,#385b91,#132747 75%);border:6px solid #f4ca59;display:block;touch-action:none}
.flipper-caption{display:flex;align-items:center;justify-content:space-between;gap:8px}
footer{text-align:center;font-size:11px;font-weight:800;color:#38566b}
@media(orientation:portrait){#app{padding:6px;gap:5px}header{min-height:38px}.brand{font-size:18px}.mascot{width:34px;height:34px}nav button{padding:7px 8px;font-size:12px;border-radius:12px}.grid,.dino-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.flipper-wrap{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;gap:7px}.flipper-wrap #table{grid-column:1/3;grid-row:1}.flipper-key{min-height:54px;border-radius:16px}.panel{padding:8px;border-radius:18px}.dino svg{height:clamp(44px,7vh,70px)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand"><div class="mascot" aria-hidden="true">🦕</div><span>¡A EXPLORAR!</span></div><div id="sayStatus" aria-live="polite">Tocá y descubrí</div></header>
<nav aria-label="Juegos">
<button data-panel="dinos" aria-selected="true">🦖 Dinosaurios</button>
<button data-panel="habla" aria-selected="false">🗣️ Hablemos</button>
<button data-panel="flipper" aria-selected="false">🎱 Flipper</button>
</nav>
<main>
<section class="panel active" id="dinos">
<h1>¡Conocé a los dinosaurios!</h1><p class="hint">Elegí uno y escuchá cómo se llama.</p>
<div class="grid dino-grid" id="dinoGrid"></div>
</section>
<section class="panel" id="habla">
<h1>Botones que hablan</h1><p class="hint">Tocá el dibujo. ¡El teléfono lo dice en voz alta!</p>
<div class="grid">
<button class="tile" style="--tile:#ffdf70;--shade:#d4aa32" data-say="Hola"><span class="emoji">👋</span>Hola</button>
<button class="tile" style="--tile:#8de4ff;--shade:#48a8cf" data-say="Quiero agua"><span class="emoji">💧</span>Quiero agua</button>
<button class="tile" style="--tile:#a9f2c5;--shade:#64bf89" data-say="Estoy contento"><span class="emoji">😊</span>Estoy contento</button>
<button class="tile" style="--tile:#ffb3d0;--shade:#d8759b" data-say="Quiero jugar"><span class="emoji">🧸</span>Quiero jugar</button>
<button class="tile" style="--tile:#c7b8ff;--shade:#8d79d3" data-say="Necesito ayuda"><span class="emoji">🙋</span>Necesito ayuda</button>
<button class="tile" style="--tile:#ffd0a6;--shade:#d99b68" data-say="Estoy cansado"><span class="emoji">😴</span>Estoy cansado</button>
<button class="tile" style="--tile:#a8e6ff;--shade:#6eafcf" data-say="Uno"><span class="emoji">1️⃣</span>Uno</button>
<button class="tile" style="--tile:#b9f0a2;--shade:#7eb86a" data-say="Dos"><span class="emoji">2️⃣</span>Dos</button>
<button class="tile" style="--tile:#ffb6a8;--shade:#d67e70" data-say="Tres"><span class="emoji">3️⃣</span>Tres</button>
</div>
</section>
<section class="panel" id="flipper">
<div class="flipper-caption"><div><h1>¡Flipper infinito!</h1><p class="hint">La pelota sigue jugando. ¡No se pierde!</p></div><button class="back" id="newBall">↻ Otra pelota</button></div>
<div class="flipper-wrap">
<button class="flipper-key" id="leftKey" aria-label="Paleta izquierda">◀</button>
<canvas id="table" aria-label="Mesa de flipper"></canvas>
<button class="flipper-key right" id="rightKey" aria-label="Paleta derecha">▶</button>
</div>
</section>
</main>
<footer>Un lugar para descubrir, jugar y volver a intentar 💛</footer>
</div>
<script>
const statusEl=document.getElementById('sayStatus');
let voices=[];
function loadVoices(){voices=speechSynthesis?.getVoices?.()||[]}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text){statusEl.textContent='🔊 '+text;if(window.AndroidSpeech?.speak){window.AndroidSpeech.speak(text);setTimeout(()=>{statusEl.textContent='Tocá y descubrí'},1800);return}if(!('speechSynthesis'in window)){statusEl.textContent='La voz no está disponible en este teléfono';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=voices.find(x=>/^es-AR$/i.test(x.lang))||voices.find(x=>/^es/i.test(x.lang));if(v)u.voice=v;u.lang=v?.lang||'es-AR';u.rate=.88;u.pitch=1;u.volume=1;u.onend=()=>statusEl.textContent='Tocá y descubrí';speechSynthesis.speak(u)}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.panel));if(b.dataset.panel==='flipper')resizeTable()}));
document.querySelectorAll('[data-say]').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.say)));
const dinoData=[
{name:'Tiranosaurio rex',art:`<svg viewBox="0 0 260 150" role="img" aria-label="Tiranosaurio rex"><defs><linearGradient id="tr" x2="0" y2="1"><stop stop-color="#a9b77a"/><stop offset="1" stop-color="#586c45"/></linearGradient></defs><ellipse cx="130" cy="137" rx="112" ry="7" fill="#54765a" opacity=".22"/><path d="M35 105 Q52 88 80 89 Q95 65 130 68 Q151 45 184 51 L210 37 235 43 224 57 245 65 221 79 194 77 Q184 96 165 106 L149 130 129 130 137 105 111 105 96 132 77 132 85 101 Q61 111 35 105Z" fill="url(#tr)" stroke="#354b37" stroke-width="3"/><path d="M188 53 L204 35 234 41 221 55 239 64 218 73 195 72Z" fill="#a9b77a" stroke="#354b37" stroke-width="3"/><circle cx="218" cy="51" r="3.5" fill="#171d17"/><path d="M214 70 Q227 76 239 68" fill="none" stroke="#303b2c" stroke-width="2"/><path d="M117 101 L125 116 117 126 M149 100 L158 116 151 128" fill="none" stroke="#354b37" stroke-width="8" stroke-linecap="round"/><path d="M179 83 l9 3 -8 5 M166 89 l9 3 -8 5" fill="none" stroke="#354b37" stroke-width="4"/><path d="M65 94 l8 -8 8 8 M91 82 l8 -8 8 8 M118 75 l8 -8 8 8" fill="#c7cf8d" stroke="#536444" stroke-width="2"/></svg>`},
{name:'Triceratops',art:`<svg viewBox="0 0 260 150" role="img" aria-label="Triceratops"><defs><linearGradient id="tc" x2="0" y2="1"><stop stop-color="#c4b17d"/><stop offset="1" stop-color="#78865c"/></linearGradient></defs><ellipse cx="130" cy="137" rx="110" ry="7" fill="#54765a" opacity=".22"/><path d="M28 94 Q43 68 92 70 Q123 51 164 69 L196 65 222 77 230 91 210 102 183 103 173 131 156 131 151 103 104 105 93 132 76 132 77 101 Q49 108 28 94Z" fill="url(#tc)" stroke="#4c5b40" stroke-width="3"/><path d="M148 68 Q156 35 190 31 Q220 39 220 76 Q197 61 178 77Z" fill="#a2a879" stroke="#4c5b40" stroke-width="3"/><path d="M169 52 L158 17 180 43 M197 51 L213 17 210 57 M218 79 L248 71 222 91" fill="#e5d7aa" stroke="#665e46" stroke-width="3"/><path d="M204 82 L240 88 215 97Z" fill="#8c9870" stroke="#4c5b40" stroke-width="2"/><circle cx="202" cy="65" r="3.5" fill="#171d17"/><path d="M80 91 l9 7 M103 83 l9 7 M128 79 l9 7" stroke="#59694a" stroke-width="3"/><path d="M94 103 L91 127 M160 103 L164 128" stroke="#4c5b40" stroke-width="9" stroke-linecap="round"/></svg>`},
{name:'Estegosaurio',art:`<svg viewBox="0 0 260 150" role="img" aria-label="Estegosaurio"><ellipse cx="130" cy="137" rx="112" ry="7" fill="#54765a" opacity=".22"/><path d="M24 100 Q42 76 84 78 Q120 59 159 75 Q187 82 207 93 L242 110 232 116 196 105 Q181 110 171 130 L154 130 155 105 105 105 96 131 78 131 81 104 Q49 112 24 100Z" fill="#b8a86f" stroke="#596344" stroke-width="3"/><path d="M74 78 L65 54 84 64 96 42 109 66 126 39 139 69 155 46 166 77 181 62 185 88Z" fill="#718d60" stroke="#4f684a" stroke-width="3"/><path d="M23 98 Q9 87 6 71" stroke="#718d60" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M6 71 l-8 -10 12 5" fill="none" stroke="#596344" stroke-width="3"/><circle cx="202" cy="88" r="3" fill="#1b2118"/><path d="M111 103 L108 128 M160 102 L166 128" stroke="#596344" stroke-width="9" stroke-linecap="round"/></svg>`},
{name:'Braquiosaurio',art:`<svg viewBox="0 0 260 150" role="img" aria-label="Braquiosaurio"><ellipse cx="130" cy="137" rx="112" ry="7" fill="#54765a" opacity=".22"/><path d="M30 91 Q54 68 104 76 Q142 70 164 90 L178 126 163 130 147 103 103 104 91 130 75 130 79 103 Q52 108 30 91Z" fill="#9cae78" stroke="#536a4c" stroke-width="3"/><path d="M154 90 Q163 60 166 34 Q166 17 183 13 L204 18 199 31 182 28 Q181 61 187 88" fill="none" stroke="#9cae78" stroke-width="19" stroke-linecap="round"/><path d="M194 18 Q208 8 226 17 L237 26 224 34 201 30Z" fill="#9cae78" stroke="#536a4c" stroke-width="3"/><circle cx="221" cy="21" r="3" fill="#1b2118"/><path d="M78 100 L74 130 M149 99 L155 130" stroke="#536a4c" stroke-width="10" stroke-linecap="round"/><path d="M32 86 Q15 80 7 65" stroke="#9cae78" stroke-width="8" fill="none" stroke-linecap="round"/></svg>`},
{name:'Velociraptor',art:`<svg viewBox="0 0 260 150" role="img" aria-label="Velociraptor"><ellipse cx="130" cy="137" rx="112" ry="7" fill="#54765a" opacity=".22"/><path d="M24 112 Q49 88 85 84 Q103 59 139 68 L171 51 204 56 232 49 216 67 191 76 166 83 Q153 99 133 103 L119 130 104 130 111 101 86 105 74 130 59 130 66 99 Q43 113 24 112Z" fill="#9b9870" stroke="#565a40" stroke-width="3"/><path d="M171 52 L194 39 226 44 238 53 216 62 190 63Z" fill="#9b9870" stroke="#565a40" stroke-width="3"/><circle cx="218" cy="49" r="3" fill="#171d17"/><path d="M111 101 L132 114 126 130 M139 98 L155 110 150 130" stroke="#565a40" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M132 114 l13 5 -8 7 M154 111 l13 4 -8 8" stroke="#e5d6aa" stroke-width="4" fill="none"/><path d="M68 89 l-11 -15 M82 82 l-7 -16 M98 76 l-4 -15" stroke="#d5c58e" stroke-width="4" stroke-linecap="round"/></svg>`},
{name:'Anquilosaurio',art:`<svg viewBox="0 0 260 150" role="img" aria-label="Anquilosaurio"><ellipse cx="130" cy="137" rx="112" ry="7" fill="#54765a" opacity=".22"/><path d="M27 102 Q35 70 87 72 Q130 57 174 76 Q200 78 215 94 L233 101 223 116 198 113 187 131 169 131 166 108 111 108 103 131 85 131 84 107 Q51 113 27 102Z" fill="#8d9b69" stroke="#4d6044" stroke-width="3"/><path d="M175 82 Q192 66 211 80 L225 96 215 110 190 108Z" fill="#9fac79" stroke="#4d6044" stroke-width="3"/><path d="M220 101 L243 112 254 123 243 132 228 125 214 116Z" fill="#6f7955" stroke="#4d6044" stroke-width="3"/><path d="M63 77 l7 -14 10 12 M92 70 l8 -14 10 14 M123 70 l8 -14 10 14 M153 76 l8 -13 10 15" fill="#d0c28d" stroke="#65734e" stroke-width="2"/><circle cx="210" cy="91" r="3" fill="#171d17"/><path d="M90 106 L87 129 M171 106 L176 129" stroke="#4d6044" stroke-width="10" stroke-linecap="round"/></svg>`}
];
const dinoGrid=document.getElementById('dinoGrid');
dinoData.forEach(({name,art})=>{const b=document.createElement('button');b.className='dino';b.innerHTML=art+'<span>'+name+'</span>';b.addEventListener('click',()=>speak(name));dinoGrid.appendChild(b)});
// Flipper amable: mesa cerrada, rebote inferior y paletas amplias. La pelota nunca sale del campo.
const canvas=document.getElementById('table'),ctx=canvas.getContext('2d');let W=700,H=420,ball={x:350,y:110,vx:2.3,vy:2.2,r:11},left=false,right=false,frame=0;
function resizeTable(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);W=canvas.width;H=canvas.height;if(ball.x>W||ball.y>H){ball.x=W/2;ball.y=H*.35}}
function resetBall(){ball={x:W/2,y:H*.25,vx:(Math.random()>.5?1:-1)*2.6,vy:2.2,r:Math.max(9,W*.014)}}
function draw(){frame++;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#ffd65a';ctx.lineWidth=8;ctx.strokeRect(5,5,W-10,H-10);
for(let i=0;i<7;i++){const x=W*(.16+i*.113),y=H*(.2+(i%2)*.18);ctx.beginPath();ctx.fillStyle=['#ff719b','#5bd4ff','#ffe16a','#7be0a2'][i%4];ctx.arc(x,y,Math.max(7,W*.014),0,Math.PI*2);ctx.fill()}
const mid=H*.84,span=W*.17;ctx.lineCap='round';ctx.lineWidth=Math.max(14,W*.035);ctx.strokeStyle='#ffe16a';ctx.beginPath();ctx.moveTo(W*.28,mid+ (left?-10:10));ctx.lineTo(W*.45,mid+(left?10:-10));ctx.stroke();ctx.strokeStyle='#64d5ff';ctx.beginPath();ctx.moveTo(W*.55,mid+(right?10:-10));ctx.lineTo(W*.72,mid+(right?-10:10));ctx.stroke();
ball.x+=ball.vx;ball.y+=ball.vy;const wall=ball.r+13;if(ball.x<wall||ball.x>W-wall)ball.vx*=-1;if(ball.y<wall)ball.vy=Math.abs(ball.vy);
if(ball.y>mid-18&&ball.y<mid+30){if(left&&ball.x<W*.49&&ball.x>W*.2){ball.vy=-Math.abs(ball.vy)-.5;ball.vx+=.9}if(right&&ball.x>W*.51&&ball.x<W*.8){ball.vy=-Math.abs(ball.vy)-.5;ball.vx-=.9}}
if(ball.y>H-wall){ball.y=H-wall;ball.vy=-Math.abs(ball.vy)-.8}
ball.vx=Math.max(-7,Math.min(7,ball.vx));ball.vy=Math.max(-8,Math.min(8,ball.vy));
ctx.beginPath();ctx.fillStyle='#fff';ctx.shadowColor='#8ceaff';ctx.shadowBlur=18;ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;requestAnimationFrame(draw)}
function key(id,side){const el=document.getElementById(id);const on=e=>{e.preventDefault();if(side==='left')left=true;else right=true};const off=e=>{e.preventDefault();if(side==='left')left=false;else right=false};el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,off))}
key('leftKey','left');key('rightKey','right');document.getElementById('newBall').addEventListener('click',resetBall);window.addEventListener('resize',resizeTable);window.addEventListener('orientationchange',()=>setTimeout(resizeTable,150));resizeTable();draw();
</script>
</body></html>
