name: Android debug APK
on:
 push:
  branches: [android-pda-native]
  paths:
   - 'android/**'
   - '.github/workflows/android-debug.yml'
 workflow_dispatch:
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: gradle/actions/setup-gradle@v4
   - name: Build PDA and diagnostic installer APKs
     run: gradle -p android :app:assembleDebug :installer:assembleDebug
   - uses: actions/upload-artifact@v4
     with:
      name: pda-zona-android-debug
      path: |
       android/app/build/outputs/apk/debug/app-debug.apk
       android/installer/build/outputs/apk/debug/installer-debug.apk
      if-no-files-found: error
      retention-days: 14
